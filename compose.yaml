services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copie .env.example para .env}
      POSTGRES_USER: ${POSTGRES_USER:?copie .env.example para .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copie .env.example para .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?copie .env.example para .env}:5432"
    volumes:
      # A partir do Postgres 18 o volume deve apontar para /var/lib/postgresql (não /data)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
